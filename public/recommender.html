<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommender - Agriculture Assistant</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #warmupStatus {
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 8px;
            min-height: 1.2em;
            transition: color 0.3s;
        }
        .loading-bar {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .loading-bar::after {
            content: '';
            display: block;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
            border-radius: 4px;
            animation: slide 1.2s ease-in-out infinite;
        }
        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="container">
        <a href="index.html" class="logo">Agri-Assistant 🌱</a>
        <nav>
            <a href="crop-data.html">Crop Data</a>
            <a href="recommender.html">Crop Recommender</a>
            <a href="techniques.html">Techniques</a>
            <a href="schemes.html">Schemes</a>
            <a href="diseases.html">Diseases</a>
            <a href="npk-advisor.html">NPK Advisor</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<main class="container">
    <h2>Crop Recommender</h2>
    <p>Enter your soil and climate conditions to get an intelligent crop recommendation.</p>

    <form id="recommenderForm">
        <div><label for="n">Nitrogen (N) content in soil:</label><input type="number" id="n" required step="any"></div>
        <div><label for="p">Phosphorous (P) content in soil:</label><input type="number" id="p" required step="any"></div>
        <div><label for="k">Potassium (K) content in soil:</label><input type="number" id="k" required step="any"></div>
        <div><label for="temperature">Temperature (°C):</label><input type="number" id="temperature" required step="any"></div>
        <div><label for="humidity">Relative Humidity (%):</label><input type="number" id="humidity" required step="any"></div>
        <div><label for="ph">pH value of soil:</label><input type="number" id="ph" required step="any"></div>
        <div><label for="rainfall">Rainfall (mm):</label><input type="number" id="rainfall" required step="any"></div>
        <button type="submit" id="submitBtn">Get Recommendation</button>
        <div id="warmupStatus"></div>
    </form>

    <div id="resultDiv"
         class="card"
         style="margin-top:30px; text-align:center; display:none;">
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2025 Agriculture Assistant. All Rights Reserved.</p>
    </div>
</footer>

<div class="creator-credit">Created by Sricharan</div>

<script>
    const API_BASE = "/api";

    const form        = document.getElementById("recommenderForm");
    const resultDiv   = document.getElementById("resultDiv");
    const submitBtn   = document.getElementById("submitBtn");
    const warmupStatus = document.getElementById("warmupStatus");

    // ── Warm up the Render ML API the moment the page loads ──────────────────
    // /api/warmup calls /predict on Render with dummy data — this forces the
    // ML model to fully load into memory (not just start the web process).
    // The button stays disabled + shows elapsed time until warmup resolves.
    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ Warming up AI...";

    async function warmupML() {
        let secs = 0;
        warmupStatus.style.color = "#f59e0b";
        warmupStatus.textContent = "🔄 Waking up AI model (0s)…";

        const timer = setInterval(() => {
            secs++;
            warmupStatus.textContent = `🔄 Waking up AI model (${secs}s)…`;
        }, 1000);

        try {
            await fetch(`${API_BASE}/warmup`);
        } catch {
            // Even on network error the Render server will have begun starting
        } finally {
            clearInterval(timer);
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Get Recommendation";
        warmupStatus.textContent = "✅ AI model is ready!";
        warmupStatus.style.color = "#16a34a";
        setTimeout(() => { warmupStatus.textContent = ""; }, 3000);
    }

    warmupML();
    // ─────────────────────────────────────────────────────────────────────────

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        resultDiv.style.display = "block";
        resultDiv.innerHTML = `<p>🌱 Analyzing your soil conditions…</p><div class="loading-bar"></div>`;
        submitBtn.disabled = true;

        const formData = {
            N:           parseFloat(document.getElementById("n").value),
            P:           parseFloat(document.getElementById("p").value),
            K:           parseFloat(document.getElementById("k").value),
            temperature: parseFloat(document.getElementById("temperature").value),
            humidity:    parseFloat(document.getElementById("humidity").value),
            ph:          parseFloat(document.getElementById("ph").value),
            rainfall:    parseFloat(document.getElementById("rainfall").value)
        };

        try {
            const response = await fetch(`${API_BASE}/recommend`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            });

            if (!response.ok) throw new Error("Prediction request failed");

            const result = await response.json();

            resultDiv.innerHTML = `
                <h3>Recommended Crop:</h3>
                <p style="font-size:1.5rem; font-weight:bold; color:#16a34a;">
                    🌾 ${result.recommended?.[0] ?? "No result"}
                </p>
            `;

        } catch (error) {
            console.error("Error:", error);
            resultDiv.innerHTML =
                '<p style="color:red;">Could not get a recommendation. Please try again.</p>';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
